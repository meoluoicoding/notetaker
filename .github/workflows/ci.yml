name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  native:
    name: Native search (Tantivy) build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # explicit stable: the root rust-toolchain.toml pins 1.85 for rust-lib;
      # search-native/ needs a recent stable (its own rust-toolchain.toml = stable)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: search-native
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:native
      # the full suite also runs tests/native-search (no longer skipped, .node built)
      - run: npm test

  build:
    name: Production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - run: node -e "require('fs').statSync('dist/index.mjs'); console.log('dist/index.mjs ok')"